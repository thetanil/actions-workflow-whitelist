# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/build-images.yml
#
# Builds and pushes the custom ARC runner image to GHCR.
# Triggered on changes to runner-image/.
#
# After a build, pin the image digest in k8s/arc-runner-values.yaml:
#   image: ghcr.io/YOUR_ORG/arc-runner@sha256:<digest from job summary>
# ─────────────────────────────────────────────────────────────────────────────
name: Build Runner Image

on:
  push:
    branches: [main]
    paths:
      - "runner-image/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-runner-image:
    name: Build and push runner image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: runner-image/
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/arc-runner:latest
            ghcr.io/${{ github.repository_owner }}/arc-runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Runner Image Built" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin this digest in \`k8s/arc-runner-values.yaml\`:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "image: ghcr.io/${{ github.repository_owner }}/arc-runner@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
